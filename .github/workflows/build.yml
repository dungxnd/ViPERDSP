name: Build ViPERDSP

on:
  push:
    branches: ["main"]
    paths:
      - "**.c"
      - "**.cpp"
      - "**.h"
      - "**.hpp"
      - "**.cmake"
      - "**/CMakeLists.txt"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]
    paths:
      - "**.c"
      - "**.cpp"
      - "**.h"
      - "**.hpp"
      - "**.cmake"
      - "**/CMakeLists.txt"
      - ".github/workflows/**"
  workflow_dispatch:

env:
  AOSP_CLANG_REV: clang-r596125

jobs:
  build:
    name: Build DSP (${{ matrix.abi }}, AOSP Clang)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Android NDK (sysroot only)
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30-beta2
          add-to-path: false

      - name: Fetch AOSP Clang ${{ env.AOSP_CLANG_REV }} (bin/ only)
        run: |
          git clone --depth=1 --filter=blob:none --no-checkout \
            --branch mirror-goog-main-llvm-toolchain-source \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            aosp-clang-repo
          cd aosp-clang-repo
          git sparse-checkout init --cone
          git sparse-checkout set ${{ env.AOSP_CLANG_REV }}/bin
          git checkout
          chmod +x ${{ env.AOSP_CLANG_REV }}/bin/*
          echo "AOSP Clang: $(./${{ env.AOSP_CLANG_REV }}/bin/clang++ --version | head -1)"

      - name: Build ViPERDSP.a (${{ matrix.abi }})
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          AOSP_CLANGXX="${PWD}/aosp-clang-repo/${{ env.AOSP_CLANG_REV }}/bin/clang++"
          AOSP_CLANG="${PWD}/aosp-clang-repo/${{ env.AOSP_CLANG_REV }}/bin/clang"
          cmake -B build/${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_ARM_NEON=TRUE \
            -DANDROID_STL=c++_static \
            -DCMAKE_C_COMPILER="${AOSP_CLANG}" \
            -DCMAKE_CXX_COMPILER="${AOSP_CLANGXX}" \
            -DCMAKE_BUILD_TYPE=Release \
            .
          cmake --build build/${{ matrix.abi }} --target ViPERDSP --parallel $(nproc)

      - name: Upload ViPERDSP.a artifact
        uses: actions/upload-artifact@v7
        with:
          name: libViPERDSP-${{ matrix.abi }}
          path: build/${{ matrix.abi }}/libViPERDSP.a
          if-no-files-found: error
